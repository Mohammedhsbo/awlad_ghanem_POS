name: Build macOS Intel

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Confirm Intel runner
        run: |
          echo "Architecture: $(uname -m)"
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          test "$(uname -m)" = "x86_64"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire PostgreSQL 16 Intel binaries
        run: bash scripts/setup-postgres-mac.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm exec prisma validate

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: pnpm exec prisma generate

      - name: Build API
        run: pnpm --filter @motorcycle-system/api build

      - name: Build macOS Intel Electron app
        run: pnpm --dir renderer package:mac:x64

      - name: Verify packaged app architecture
        run: |
          file "renderer/release/mac/Motorcycle System POS.app/Contents/MacOS/Motorcycle System POS"

      - name: Run packaged runtime smoke test
        env:
          POS_SMOKE_STATUS_PATH: ${{ runner.temp }}/pos-smoke-status.json
          POS_ADMIN_EMAIL: admin@manage.com
          POS_ADMIN_PASSWORD: admin123
        run: |
          node scripts/ci/smoke-packaged-mac.mjs \
            "renderer/release/mac/Motorcycle System POS.app/Contents/MacOS/Motorcycle System POS"

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: POS-macOS-Intel
          path: renderer/release/*.dmg
          if-no-files-found: error